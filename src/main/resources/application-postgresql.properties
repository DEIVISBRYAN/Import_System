# Compatibilidad con la instalacion anterior. No se activa por defecto.
spring.config.import=optional:file:./.local/database.properties
app.database.kind=postgresql
spring.datasource.url=${APP_DB_URL:jdbc:postgresql://127.0.0.1:15432/importadora}
spring.datasource.username=${APP_DB_USER:importadora_app}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.locations=classpath:db/postgresql
