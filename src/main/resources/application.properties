# Desactiva servidor web Tomcat (JavaFX corre en la UI local)
spring.main.web-application-type=none

# Usa proxies JDK en vez de CGLIB (CGLIB es incompatible con JPMS / módulo nombrado)
spring.aop.proxy-target-class=false

# SQLite local. No necesita servidor ni credenciales de PostgreSQL.
spring.config.import=optional:file:./.local/sqlite.properties
app.database.kind=sqlite
app.sqlite.path=${APP_SQLITE_PATH:}
app.caja.numero=${APP_CAJA:1}
# Tipo de cambio ingresado manualmente. No hay consultas a una API externa.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Migraciones independientes del antiguo esquema SQLite
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/sqlite
spring.flyway.baseline-on-migrate=false
